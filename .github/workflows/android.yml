name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # GitHub runner 自带 Android SDK。不用 android-actions/setup-android@v3，
      # 它跟 runner 预装的 cmdline-tools 16 不兼容（Failed to find package 'tools'）。
      - name: Ensure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build APKs (debug + release, no signing required)
        run: ./gradlew assembleGenericDebug assembleGenericRelease --no-configuration-cache

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: seal-apks
          path: |
            app/build/outputs/apk/generic/debug/*.apk
            app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error
          retention-days: 20
